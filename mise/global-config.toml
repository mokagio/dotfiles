# Global defaults. Override per-directory via `.mise.toml` or
# (for `ruby`/`node`) via `.ruby-version` / `.node-version` files —
# see idiomatic_version_file_enable_tools below.
[tools]
ruby = "3.4.7"
node = "lts"
"npm:@openai/codex" = "latest"

[settings]
# Let mise honour `.ruby-version` files in project directories.
# The a8c iOS repos pin Ruby 3.2.2 via `.ruby-version` (matching CI);
# without this, the global 3.4.7 pin above overrides them and fastlane
# 2.225.0 crashes because Ruby 3.4 dropped stdlib gems (abbrev, kconv).
idiomatic_version_file_enable_tools = ["ruby", "node"]

# Use precompiled Ruby binaries instead of building from source.
# Source builds on recent macOS (e.g. 26.x) fail at the psych extconf
# baseline-warning probe with newer Apple Clang. Mise itself announced
# precompiled binaries will be the default in 2026.8.0; opt in early.
[settings.ruby]
compile = false
