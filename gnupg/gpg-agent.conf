# Use pinentry-mac so the agent can prompt for the passphrase via a native
# macOS dialog (and offer "Save in Keychain"). Absolute path because gpg-agent
# runs as a daemon with a minimal PATH that doesn't include the Homebrew bin.
#
# Path is Apple-Silicon-specific (brew prefix `/opt/homebrew`). On Intel use
# `/usr/local/bin/pinentry-mac` instead.
pinentry-program /opt/homebrew/bin/pinentry-mac
