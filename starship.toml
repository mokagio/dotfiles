# Starship prompt — replaces spaceship-prompt + spaceship_verbose_git.zsh

# Show a blank line between prompts
add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Right prompt: time
[time]
disabled = false
format = "[$time]($style)"

# Git branch in magenta, no prefix
[git_branch]
format = "[$branch(:$remote_branch)]($style) "
style = "magenta"

# Git status with counts and matching symbols
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "red"
untracked = "${count}?"
staged = "${count}+"
modified = "${count}!"
deleted = "${count}✘"
stashed = "${count}$"
ahead = "${count}⬆"
behind = "${count}⬇"
renamed = "${count}»"
diverged = "⇕"
conflicted = "⚡️"

# Ruby version — no prefix clutter
[ruby]
format = "[$version]($style) "

# Hide modules we don't want
[docker_context]
disabled = true

[gradle]
disabled = true

[java]
disabled = true
