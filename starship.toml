# Starship prompt — replaces spaceship-prompt + spaceship_verbose_git.zsh

# Show a blank line between prompts
add_newline = true

[character]
# possible symbols to consider:
# ❯
# ➜
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

# Right prompt: time
[time]
disabled = true
format = "[$time]($style) "

[cmd_duration]
min_time = 1_000
format = "[took $duration]($style) "

[git_branch]
format = "[$branch(:$remote_branch)]($style) "
style = "purple"

# Git status with counts and thin symbols.
# Starship has no join/separator for status items, so each symbol carries a
# trailing space.
# This means the last item leaves a space before ']' — accepted trade-off.
# https://github.com/starship/starship/issues/1724
[git_status]
format = '([\[$all_status$ahead_behind\]](bold dimmed red) )'
style = "bold dimmed red"
ahead = "⇡${count} "
behind = "⇣${count} "
conflicted = "≠ "
stashed = "⚑${count} "
deleted = "✘${count} "
renamed = "»${count} "
modified = "!${count} "
staged = "+${count} "
untracked = "?${count} "
up_to_date = ""

# Ruby version — no prefix clutter
[ruby]
format = "[$version]($style) "
style = "bold dimmed red"

# Hide modules we don't want
[docker_context]
disabled = true

[gradle]
disabled = true

[java]
disabled = true

[lua]
disabled = true

[swift]
disabled = true
